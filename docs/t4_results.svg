<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Measured latency on NVIDIA Tesla T4</title>
  <desc id="desc">Median latency for eager PyTorch, torch compile, and fused Triton for FP16 and FP32. Whiskers show minimum and maximum trial medians.</desc>
  <style>
    .title { font: 700 28px Arial, sans-serif; fill: #172033; }
    .subtitle { font: 15px Arial, sans-serif; fill: #526173; }
    .axis { stroke: #79879a; stroke-width: 1.5; }
    .grid { stroke: #d9dfe7; stroke-width: 1; }
    .tick { font: 13px Arial, sans-serif; fill: #526173; }
    .label { font: 700 16px Arial, sans-serif; fill: #263247; }
    .value { font: 700 14px Arial, sans-serif; fill: #263247; }
    .legend { font: 14px Arial, sans-serif; fill: #263247; }
    .whisker { stroke: #263247; stroke-width: 2; }
  </style>
  <rect width="1200" height="720" rx="18" fill="#f7f9fc"/>
  <text x="600" y="46" text-anchor="middle" class="title">Measured latency on NVIDIA Tesla T4</text>
  <text x="600" y="74" text-anchor="middle" class="subtitle">8192 by 128 input, one Colab session, lower is better</text>

  <line x1="260" y1="120" x2="260" y2="610" class="axis"/>
  <line x1="260" y1="610" x2="1010" y2="610" class="axis"/>

  <g>
    <line x1="260" y1="120" x2="260" y2="610" class="grid"/>
    <line x1="385" y1="120" x2="385" y2="610" class="grid"/>
    <line x1="510" y1="120" x2="510" y2="610" class="grid"/>
    <line x1="635" y1="120" x2="635" y2="610" class="grid"/>
    <line x1="760" y1="120" x2="760" y2="610" class="grid"/>
    <line x1="885" y1="120" x2="885" y2="610" class="grid"/>
    <line x1="1010" y1="120" x2="1010" y2="610" class="grid"/>
    <text x="260" y="634" text-anchor="middle" class="tick">0.00</text>
    <text x="385" y="634" text-anchor="middle" class="tick">0.05</text>
    <text x="510" y="634" text-anchor="middle" class="tick">0.10</text>
    <text x="635" y="634" text-anchor="middle" class="tick">0.15</text>
    <text x="760" y="634" text-anchor="middle" class="tick">0.20</text>
    <text x="885" y="634" text-anchor="middle" class="tick">0.25</text>
    <text x="1010" y="634" text-anchor="middle" class="tick">0.30</text>
    <text x="635" y="670" text-anchor="middle" class="label">Median latency in milliseconds</text>
  </g>

  <text x="52" y="172" class="label">FP16</text>
  <text x="52" y="422" class="label">FP32</text>

  <text x="235" y="215" text-anchor="end" class="tick">Eager PyTorch</text>
  <rect x="260" y="190" width="463.32" height="36" rx="5" fill="#6f7d90"/>
  <line x1="594.60" y1="208" x2="762.04" y2="208" class="whisker"/>
  <line x1="594.60" y1="201" x2="594.60" y2="215" class="whisker"/>
  <line x1="762.04" y1="201" x2="762.04" y2="215" class="whisker"/>
  <text x="775" y="214" class="value">0.185328</text>

  <text x="235" y="275" text-anchor="end" class="tick">torch.compile</text>
  <rect x="260" y="250" width="647.60" height="36" rx="5" fill="#bf7a2a"/>
  <line x1="675.88" y1="268" x2="994.16" y2="268" class="whisker"/>
  <line x1="675.88" y1="261" x2="675.88" y2="275" class="whisker"/>
  <line x1="994.16" y1="261" x2="994.16" y2="275" class="whisker"/>
  <text x="1010" y="274" class="value">0.259040</text>

  <text x="235" y="335" text-anchor="end" class="tick">Fused Triton</text>
  <rect x="260" y="310" width="281.44" height="36" rx="5" fill="#2878b5"/>
  <line x1="451.92" y1="328" x2="545.72" y2="328" class="whisker"/>
  <line x1="451.92" y1="321" x2="451.92" y2="335" class="whisker"/>
  <line x1="545.72" y1="321" x2="545.72" y2="335" class="whisker"/>
  <text x="555" y="334" class="value">0.112576, 1.65x</text>

  <text x="235" y="465" text-anchor="end" class="tick">Eager PyTorch</text>
  <rect x="260" y="440" width="520.68" height="36" rx="5" fill="#6f7d90"/>
  <line x1="672.00" y1="458" x2="884.56" y2="458" class="whisker"/>
  <line x1="672.00" y1="451" x2="672.00" y2="465" class="whisker"/>
  <line x1="884.56" y1="451" x2="884.56" y2="465" class="whisker"/>
  <text x="895" y="464" class="value">0.208272</text>

  <text x="235" y="525" text-anchor="end" class="tick">torch.compile</text>
  <rect x="260" y="500" width="643.24" height="36" rx="5" fill="#bf7a2a"/>
  <line x1="674.68" y1="518" x2="953.32" y2="518" class="whisker"/>
  <line x1="674.68" y1="511" x2="674.68" y2="525" class="whisker"/>
  <line x1="953.32" y1="511" x2="953.32" y2="525" class="whisker"/>
  <text x="965" y="524" class="value">0.257296</text>

  <text x="235" y="585" text-anchor="end" class="tick">Fused Triton</text>
  <rect x="260" y="560" width="266.28" height="36" rx="5" fill="#2878b5"/>
  <line x1="398.68" y1="578" x2="551.32" y2="578" class="whisker"/>
  <line x1="398.68" y1="571" x2="398.68" y2="585" class="whisker"/>
  <line x1="551.32" y1="571" x2="551.32" y2="585" class="whisker"/>
  <text x="560" y="584" class="value">0.106512, 1.96x</text>

  <rect x="840" y="92" width="16" height="16" rx="2" fill="#6f7d90"/>
  <text x="864" y="105" class="legend">Eager</text>
  <rect x="920" y="92" width="16" height="16" rx="2" fill="#bf7a2a"/>
  <text x="944" y="105" class="legend">Inductor</text>
  <rect x="1025" y="92" width="16" height="16" rx="2" fill="#2878b5"/>
  <text x="1049" y="105" class="legend">Triton</text>

  <text x="600" y="701" text-anchor="middle" class="subtitle">Bars show medians. Lines show minimum and maximum trial medians. Source: committed JSON records.</text>
</svg>
