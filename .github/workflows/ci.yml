name: CPU checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax and unit tests
        run: |
          python -m py_compile agentic_kernel_compiler.py agent_eval.py colab/paired_confirmation.py
          python -m unittest -q
      - name: CPU compiler smoke test
        run: |
          python agentic_kernel_compiler.py --quick
      - name: Exact mock-fixture evaluation smoke test (no OS sandbox)
        run: |
          python agent_eval.py --device cpu --agent mock --trusted-fixture-colab --max-rounds 3 --quick
